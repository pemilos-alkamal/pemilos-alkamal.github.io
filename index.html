const { app, BrowserWindow } = require('electron');
app.whenReady().then(() => {
  const win = new BrowserWindow({ kiosk: true, fullscreen: true, autoHideMenuBar: true });
  win.setMenu(null);
  win.loadFile('index.html');
  win.webContents.on('before-input-event', (e, i) => {
    if (i.type !== 'keyDown' || !i.control || !i.shift) return;
    if (i.code === 'KeyF') { e.preventDefault(); const k = !win.isKiosk(); win.setKiosk(k); win.setFullScreen(k); } // keluar/masuk fullscreen
    if (i.code === 'KeyQ') { e.preventDefault(); app.quit(); } // tutup aplikasi
  });
});
app.on('window-all-closed', () => app.quit());

<body>
<div id="app"></div>
<script>
// ====== ISI URL WEB APP GOOGLE APPS SCRIPT DI SINI ======
const API_URL = "https://script.google.com/macros/s/AKfycbxJgeHanpzwAIf8J5ScEaDplzkyA_Lw7qO8sBtCeODPEPBYF0tC2NhSZVEeTIcW-ZJB/exec";
// =========================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const URL_ = API_URL.startsWith('http') ? API_URL : '';
let S = {nama:'Pemilos', logo:'', paslon:[]}, V = null, pick = null, A = null, clicks = 0, ct;

const sleep = ms => new Promise(r => setTimeout(r, ms));
function errMsg(e) {
  if (!navigator.onLine) return 'Tidak ada koneksi internet.';
  return ({
    timeout: 'Server terlalu lama merespons (sibuk). Coba lagi sebentar.',
    busy: 'Server Google sedang sibuk. Coba lagi sebentar.',
    deploy: 'Server menolak akses. Pastikan deploy Web app diatur "Anyone" dan URL berakhiran /exec.',
    net: 'Gagal terhubung. Periksa internet, lalu pastikan deploy Web app diatur "Anyone" dan URL berakhiran /exec.'
  })[e && e.kind] || 'Terjadi kesalahan: ' + ((e && e.message) || e);
}
// kirim ke Google Script: batas waktu 25 dtk, coba ulang otomatis 3x (addVoter 1x agar tidak ganda)
async function api(d) {
  if (A) { d.u = A.u; d.p = A.p; }
  const tries = d.action === 'addVoter' ? 1 : 3; let err;
  for (let i = 0; i < tries; i++) {
    if (i) await sleep(1000 * i);
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 25000);
    try {
      const r = await fetch(URL_, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(d), signal:ac.signal});
      const txt = await r.text(); clearTimeout(to);
      try { return JSON.parse(txt); } catch (x) { err = Object.assign(new Error('format'), {kind: /accounts\.google|ServiceLogin|sign in/i.test(txt) ? 'deploy' : 'busy'}); }
    } catch (x) { clearTimeout(to); err = Object.assign(new Error('net'), {kind: x.name === 'AbortError' ? 'timeout' : 'net'}); }
    if (err.kind === 'deploy') break;
  }
  throw err;
}
// ===== FULLSCREEN (browser dan aplikasi .exe). Jika memakai main.js kiosk, jendela sudah fullscreen =====
const isEl = /Electron/i.test(navigator.userAgent), isMob = /Mobi|Android/i.test(navigator.userAgent);
let allowExit = false;
async function goFS() {
  if (isMob || allowExit || document.fullscreenElement || !document.documentElement.requestFullscreen) return;
  try {
    await document.documentElement.requestFullscreen({navigationUI:'hide'});
    if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['Escape']).catch(() => {});
  } catch (e) {}
}
// Ctrl+Shift+F: keluar/masuk fullscreen. F11 diblokir saat mode terkunci.
document.addEventListener('keydown', e => {
  if (isMob) return;
  if (e.ctrlKey && e.shiftKey && e.code === 'KeyF') {
    e.preventDefault(); allowExit = !allowExit;
    if (allowExit) { if (document.fullscreenElement) document.exitFullscreen(); toast('Fullscreen dimatikan. Tekan Ctrl+Shift+F untuk mengaktifkan lagi.'); }
    else goFS();
  } else if (e.key === 'F11' && !allowExit) e.preventDefault();
}, true);
// setelah keluar fullscreen (mis. tekan Esc), klik/tombol/sentuh berikutnya masuk fullscreen lagi
['click', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, goFS, true));
goFS(); // coba langsung saat dibuka (berhasil jika pembungkus .exe mengizinkan)

let cur = '', tk = 0;
function saveCache(r) { try { localStorage.setItem('pemilos_cache', JSON.stringify(r)); } catch (e) {} }
function toast(t, bad) { const e = document.createElement('div'); e.textContent = t; e.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:' + (bad ? '#dc2626' : '#059669') + ';color:#fff;padding:12px 22px;border-radius:10px;font-weight:700;z-index:99;max-width:90vw;text-align:center'; document.body.appendChild(e); setTimeout(() => e.remove(), 3500); }
function shell(inner) {
  cur = ''; tk++;
  $('#app').innerHTML = `<header><div id="logo" onclick="logoClick()">${S.logo ? `<img src="${S.logo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">` : '🗳️'}</div><h1>${esc(S.nama)}</h1></header><div id="view">${inner}</div>`;
}
function logoClick() {
  clearTimeout(ct); ct = setTimeout(() => clicks = 0, 2500);
  if (++clicks >= 5) { clicks = 0; adminLogin(); }
}

async function start() {
  V = null; pick = null; A = null; resP = vlP = null; showTbl = false;
  if (!URL_) return setupUrl();
  const cc = localStorage.getItem('pemilos_cache');
  if (cc) { try { S = JSON.parse(cc); document.title = S.nama; screen1(); refresh(); return; } catch (e) {} }
  shell('<p class="c">Memuat...</p>');
  try { const r = await api({action:'init'}); S = r; saveCache(r); } catch (e) { shell(`<p class="err">${esc(errMsg(e))}</p><div class="c"><button onclick="start()">Coba lagi</button></div>`); return; }
  document.title = S.nama; screen1();
}
async function refresh() {
  try { const r = await api({action:'init'}); if (JSON.stringify(r) === JSON.stringify(S)) return; S = r; saveCache(r); document.title = S.nama; if (cur === 's1' && !$('#id').value) screen1(); } catch (e) {}
}
function setupUrl() {
  shell(`<div class="box"><h2>URL belum diisi</h2><p>Buka <b>index.html</b>, lalu isi konstanta <b>API_URL</b> dengan URL hasil deploy Google Apps Script.</p></div>`);
}

// ---------- Layar 1: ID ----------
function screen1(msg) {
  shell(`<div class="box"><h2>Konfirmasi Pemilih</h2><label>ID</label><input id="id" autocomplete="off" autofocus onkeydown="if(event.key==='Enter')cekId()"><div class="c"><button onclick="cekId()">OK</button></div><div class="err" id="m">${msg?'':''}</div>${msg?`<div class="ok">${msg}</div>`:''}</div>`);
  cur = 's1'; $('#id').focus();
}
async function cekId() {
  const id = $('#id').value.trim(); if (!id) return;
  if (JSON.parse(localStorage.getItem('pemilos_q') || '[]').some(x => x.id.toUpperCase() === id.toUpperCase())) return $('#m').textContent = 'ID ini sudah digunakan untuk memilih.';
  $('#m').textContent = 'Memeriksa...';
  try { const r = await api({action:'voter', id}); if (!r.ok) return $('#m').textContent = r.msg; V = r.pemilih; screen2(); }
  catch (e) { $('#m').textContent = errMsg(e); }
}
// ---------- Layar 2: Identitas ----------
function screen2() {
  const t = V.tgl_lahir.split('-').reverse().join('-');
  shell(`<div class="box"><h2>Identitas Pemilih</h2>
  <div class="row"><b>Nama</b>: ${esc(V.nama)}</div><div class="row"><b>NISN</b>: ${esc(V.nisn)}</div><div class="row"><b>Kelas</b>: ${esc(V.kelas)}</div>
  <div class="row"><b>Jenis Kelamin</b>: ${esc(V.gender)}</div><div class="row"><b>Tgl Lahir</b>: ${esc(t)}</div>
  <div class="c"><button class="gray" onclick="start()">Batal</button> <button onclick="screen3()">LANJUT</button></div></div>`);
}
// ---------- Layar 3: Paslon ----------
function screen3() {
  pick = null;
  shell(`<div class="grid">${S.paslon.map(p => `<div class="card" id="c${p.no}" onclick="sel('${p.no}')"><small>Paslon ${p.no}</small><img src="${p.gambar}"><h3>${esc(p.nama)}</h3></div>`).join('')}</div>
  <div class="c"><button id="kf" disabled onclick="konfirm()">KONFIRMASI</button></div>`);
}
function sel(n) { pick = n; document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.id === 'c' + n)); $('#kf').disabled = false; }
// ---------- Layar 4: Yakin ----------
function konfirm() {
  const p = S.paslon.find(x => x.no === pick);
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'md';
  m.innerHTML = `<div><h2>Yakin!</h2><p>Anda memilih <b>Paslon ${p.no} - ${esc(p.nama)}</b>?</p><button id="ya" onclick="kirim()">YA</button><button class="red" onclick="$('#md').remove()">TIDAK</button></div>`;
  document.body.appendChild(m);
}
function kirim() {
  $('#md').remove();
  const q = JSON.parse(localStorage.getItem('pemilos_q') || '[]');
  q.push({id:V.id, paslon:pick}); localStorage.setItem('pemilos_q', JSON.stringify(q));
  flush(); start(); toast('Terima kasih, suara Anda tersimpan.');
}
let fl = false;
async function flush() { // kirim suara di latar belakang, ulangi jika gagal
  if (fl) return; fl = true;
  try {
    while (true) {
      const q = JSON.parse(localStorage.getItem('pemilos_q') || '[]'); if (!q.length) break;
      try { await api({action:'vote', id:q[0].id, paslon:q[0].paslon}); } catch (e) { setTimeout(flush, 5000); break; }
      const n = JSON.parse(localStorage.getItem('pemilos_q') || '[]'); n.shift(); localStorage.setItem('pemilos_q', JSON.stringify(n));
    }
  } finally { fl = false; }
}

// ================= ADMIN =================
function adminLogin() {
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'md';
  m.innerHTML = `<div style="text-align:left"><h2>Login Admin</h2><label>Username</label><input id="au"><label>Password</label><input id="ap" type="password" onkeydown="if(event.key==='Enter')doLogin()"><div class="err" id="am"></div><div class="c"><button class="gray" onclick="$('#md').remove()">Batal</button> <button onclick="doLogin()">Masuk</button></div></div>`;
  document.body.appendChild(m); $('#au').focus();
}
async function doLogin() {
  A = {u:$('#au').value, p:$('#ap').value};
  try { const r = await api({action:'adminLogin'}); if (!r.ok) { A = null; return $('#am').textContent = r.msg; } $('#md').remove(); resP = vlP = null; tab('set'); loadRes().catch(() => {}); loadVL().catch(() => {}); }
  catch (e) { A = null; $('#am').textContent = errMsg(e); }
}
function tab(t) {
  const T = [['set','Setting Website'],['pas','Input Paslon'],['vot','Input Pemilih'],['has','Hasil Pemilos']];
  shell(`<div class="tabs">${T.map(x => `<button class="${x[0]===t?'on':''}" onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}<button class="red" style="margin-left:auto" onclick="start()">Keluar</button></div><div id="tv"></div>`);
  ({set:tSet, pas:tPas, vot:tVot, has:tHas})[t]();
}
function img(file, w, h, png) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => { const i = new Image(); i.onload = () => {
      const k = Math.min(w / i.width, h / i.height, 1), c = document.createElement('canvas');
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      const x = c.getContext('2d'); if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); } x.drawImage(i, 0, 0, c.width, c.height);
      let d = png ? c.toDataURL('image/png') : '', q = .85;
      if (!d || d.length > 45000) { do { d = c.toDataURL('image/jpeg', q); q -= .1; } while (d.length > 45000 && q > .1); }
      res(d); }; i.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
// Setting
let newLogo = null;
function tSet() {
  newLogo = null;
  $('#tv').innerHTML = `<div class="box"><h2>Setting Website</h2><label>Nama Website</label><input id="sn" value="${esc(S.nama)}">
  <label>Link Logo (URL gambar)</label><input id="sl" value="${esc(S.logo)}" placeholder="https://..."><small>Bisa link Google Drive (bagikan: Siapa saja yang memiliki link) atau link gambar langsung.</small><label>Username Admin Baru (kosongkan bila tidak diubah)</label><input id="su">
  <label>Password Admin Baru (kosongkan bila tidak diubah)</label><input id="sp" type="password"><div class="c"><button onclick="saveSet()">Simpan</button></div><div id="sm"></div></div>`;
}
async function saveSet() {
  const nu = $('#su').value.trim(), np = $('#sp').value;
  const r = await api({action:'saveSettings', nama:$('#sn').value.trim() || S.nama, logo:fx($('#sl').value.trim()), newUser:nu, newPass:np});
  if (!r.ok) return toast(r.msg, 1), $('#sm').innerHTML = `<div class="err">${esc(r.msg)}</div>`;
  if (nu) A.u = nu; if (np) A.p = np;
  S = await api({action:'init'}); saveCache(S); document.title = S.nama; tab('set');
  toast('Pengaturan berhasil disimpan.');
}
// Paslon
let PL = [];
function tPas() {
  PL = S.paslon.map(p => ({nama:p.nama, gambar:p.gambar}));
  if (!PL.length) PL = [{nama:'', gambar:''}, {nama:'', gambar:''}];
  drawPas();
}
function drawPas() {
  $('#tv').innerHTML = `<label>Jumlah Paslon</label><select id="jp" style="width:120px" onchange="setJP(+this.value)">${[1,2,3,4,5,6,7,8].map(n => `<option ${n===PL.length?'selected':''}>${n}</option>`).join('')}</select>
  ${PL.map((p, i) => `<div class="pv"><b>Paslon ${i+1}</b>${p.gambar ? `<img src="${p.gambar}">` : ''}<input type="text" placeholder="Nama paslon" value="${esc(p.nama)}" oninput="PL[${i}].nama=this.value"><input type="text" placeholder="Link gambar (URL)" value="${esc(p.gambar)}" oninput="PL[${i}].gambar=fx(this.value.trim())" onchange="drawPas()"></div>`).join('')}
  <div class="c"><button onclick="savePas()">Simpan Paslon</button></div><div id="pm"></div>`;
}
function setJP(n) { while (PL.length < n) PL.push({nama:'', gambar:''}); PL.length = n; drawPas(); }
// ubah link Google Drive jadi link gambar langsung
function fx(u) {
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/(?:open|uc)\?[^ ]*id=([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000' : u;
}
async function savePas() {
  if (PL.some(p => !p.nama.trim() || !p.gambar)) return $('#pm').innerHTML = '<div class="err">Lengkapi nama dan link gambar semua paslon.</div>';
  const r = await api({action:'savePaslon', list:PL.map(p => ({nama:p.nama.trim(), gambar:p.gambar}))});
  if (!r.ok) return toast(r.msg, 1), $('#pm').innerHTML = `<div class="err">${esc(r.msg)}</div>`;
  S = await api({action:'init'}); saveCache(S); toast('Paslon berhasil disimpan.');
}
// Pemilih
async function tVot(force) {
  $('#tv').innerHTML = `<div class="box" style="max-width:none"><h2>Input Pemilih</h2><div class="grid" style="gap:10px">
  <div><label>Nama</label><input id="vn" oninput="genId()"></div><div><label>NISN</label><input id="vs"></div><div><label>Kelas</label><input id="vk"></div>
  <div><label>Jenis Kelamin</label><select id="vg"><option>Laki-laki</option><option>Perempuan</option></select></div>
  <div><label>Tanggal Lahir</label><input type="date" id="vt" onchange="genId()"></div><div><label>ID (otomatis)</label><input id="vi" readonly style="background:#f3f4f6"></div></div>
  <div class="c"><button onclick="addV()">Tambah Pemilih</button></div><div id="vm"></div></div><div id="vl" style="margin-top:16px">Memuat...</div>`;
  listV(force);
}
function genId() {
  const n = $('#vn').value.trim(), t = $('#vt').value;
  $('#vi').value = (n && t) ? n[0].toUpperCase() + t.slice(8, 10) + t.slice(5, 7) + t.slice(2, 4) : '';
}
async function addV() {
  const p = {nama:$('#vn').value.trim(), nisn:$('#vs').value.trim(), kelas:$('#vk').value.trim(), gender:$('#vg').value, tgl:$('#vt').value, id:$('#vi').value};
  if (!p.nama || !p.nisn || !p.kelas || !p.tgl) return $('#vm').innerHTML = '<div class="err">Lengkapi semua data.</div>';
  const r = await api({action:'addVoter', pemilih:p});
  if (!r.ok) return toast(r.msg, 1), $('#vm').innerHTML = `<div class="err">${esc(r.msg)}</div>`;
  resP = null; tVot(true); toast('Pemilih berhasil ditambahkan. ID: ' + p.id);
}
async function listV(force) {
  const my = tk, r = await loadVL(force); if (my !== tk || !$('#vl')) return;
  $('#vl').innerHTML = `<button class="sm" onclick="listV(true)">Refresh</button> <b>Total pemilih: ${r.list.length}</b><table><tr><th>ID</th><th>Nama</th><th>NISN</th><th>Kelas</th><th>JK</th><th>Tgl Lahir</th><th>Status</th><th></th></tr>
  ${r.list.map(v => `<tr><td>${esc(v.id)}</td><td>${esc(v.nama)}</td><td>${esc(v.nisn)}</td><td>${esc(v.kelas)}</td><td>${esc(v.gender)}</td><td>${esc(v.tgl_lahir)}</td><td>${v.sudah ? 'Sudah memilih' : 'Belum'}</td><td><button class="red sm" onclick="delV('${esc(v.id)}')">Hapus</button></td></tr>`).join('')}</table>`;
}
async function delV(id) { if (confirm('Hapus pemilih ' + id + '?')) { const r = await api({action:'delVoter', id}); toast(r.ok ? 'Pemilih berhasil dihapus.' : r.msg, !r.ok); resP = null; listV(true); } }
// Hasil
let showTbl = false, resP = null, vlP = null;
// data admin dimuat sekali, dipakai ulang sampai ditekan Refresh
function loadRes(f) { if (!resP || f) resP = api({action:'results'}).catch(e => { resP = null; throw e; }); return resP; }
function loadVL(f) { if (!vlP || f) vlP = api({action:'voters'}).catch(e => { vlP = null; throw e; }); return vlP; }
function toggleTbl() {
  showTbl = !showTbl;
  $('#tbl').style.display = showTbl ? 'block' : 'none';
  $('#tt').textContent = showTbl ? 'Sembunyikan Tabel' : 'Tampilkan Tabel';
}
async function tHas(force) {
  const my = tk; $('#tv').innerHTML = 'Memuat...';
  const r = await loadRes(force), col = ['#0f766e','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#ec4899','#84cc16','#06b6d4'];
  if (my !== tk || !$('#tv')) return;
  const tot = r.suara.length, cnt = r.paslon.map(p => ({...p, n:r.suara.filter(s => s.paslon_no === p.no).length}));
  const pc = n => tot ? (n * 100 / tot) : 0; let acc = 0;
  const grad = tot ? cnt.map((c, i) => { const a = acc; acc += pc(c.n); return `${col[i%8]} ${a}% ${acc}%`; }).join(',') : '#e5e7eb 0 100%';
  const max = Math.max(0, ...cnt.map(c => c.n)), w = cnt.filter(c => c.n === max);
  $('#tv').innerHTML = `<div style="display:flex;gap:30px;flex-wrap:wrap;align-items:center;justify-content:center">
  <div class="pie" style="background:conic-gradient(${grad})"></div>
  <div>${cnt.map((c, i) => `<div style="margin:6px 0"><span style="display:inline-block;width:14px;height:14px;background:${col[i%8]};border-radius:3px"></span> <b>Paslon ${c.no} - ${esc(c.nama)}</b>: ${c.n} suara (${pc(c.n).toFixed(1)}%)</div>`).join('')}
  <div style="margin-top:8px">Suara masuk: ${tot} dari ${r.totalPemilih} pemilih</div></div></div>
  <div class="win">${!tot ? 'Belum ada suara masuk' : w.length > 1 ? 'Hasil seri: ' + w.map(x => 'Paslon ' + x.no).join(' & ') : '🏆 Pemenang PEMILOS: Paslon ' + w[0].no + ' - ' + esc(w[0].nama)}</div>
  <div class="c" style="margin:0 0 8px"><button class="sm" onclick="tHas(true)">Refresh</button> <button class="sm gray" id="tt" onclick="toggleTbl()">${showTbl ? 'Sembunyikan Tabel' : 'Tampilkan Tabel'}</button></div>
  <div id="tbl" style="display:${showTbl ? 'block' : 'none'}"><table><tr><th>Waktu</th><th>ID</th><th>Nama</th><th>Kelas</th><th>Memilih</th></tr>${r.suara.map(s => `<tr><td>${esc(s.waktu)}</td><td>${esc(s.id)}</td><td>${esc(s.nama)}</td><td>${esc(s.kelas)}</td><td>Paslon ${esc(s.paslon_no)} - ${esc(s.paslon_nama)}</td></tr>`).join('')}</table></div>`;
}
window.addEventListener('unhandledrejection', ev => toast(errMsg(ev.reason), 1));
setInterval(() => { if (!A && cur === 's1') api({action:'ping'}).catch(() => {}); }, 240000); // jaga server tetap aktif
start(); flush();
</script>
